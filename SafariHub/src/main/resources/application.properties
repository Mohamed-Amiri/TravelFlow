spring.application.name=SafariHub

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/TravelFlow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Server =====
server.port=8081

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=SafariHub2024SuperSecretKeyForJWTTokenGenerationMustBe256Bits!!
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors-allowed-origins=http://localhost:4200,http://localhost:3000

# ===== Default Admin =====
app.admin.email=admin@safarihub.com
app.admin.password=Admin@123
app.admin.first-name=SafariHub
app.admin.last-name=Administrator

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Logging =====
logging.level.com.safarihub=DEBUG
logging.level.org.springframework.security=DEBUG
